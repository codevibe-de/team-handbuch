[project]
name = "team-handbuch"
version = "0.1.0"
description = "Team handbook for agentic development with Claude Code - exercise project of the Codevibe course T10"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]
